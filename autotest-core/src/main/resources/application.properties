# Default test configuration. Environment-specific secrets must not be committed.
test.environment=TEST
service.base-url=http://localhost
soap.base-url=http://localhost
vault.url=http://localhost:8200
vault.auth.path=auth/basic/login
vault.username=${VAULT_USERNAME:}
vault.password=${VAULT_PASSWORD:}
camunda.base-url=http://localhost

# REST client timeouts in milliseconds
rest.timeout.connection-request-ms=5000
rest.timeout.connect-ms=5000
rest.timeout.response-ms=10000
